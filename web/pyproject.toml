[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qalun-web"
version = "0.1.0"
description = "A small web layer over QuranText: upload a recording, get its subtitles back."
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
  # QuranText itself is installed from the repository root (see the Dockerfile and
  # README); it is not on PyPI, so it is not listed here.
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "redis>=5,<9",
  "rq>=2,<3",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "fakeredis>=2.23,<3",
]

[project.scripts]
qalun-web-worker = "qalun_web.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qalun_web = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  # Starlette's test client asks for httpx2, which needs idna>=3.18; QuranText pins
  # idna==3.13 exactly (see the root pyproject.toml), so httpx it stays for now.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "e2e: runs QuranText's real pipeline on a recording named by QALUN_E2E_AUDIO",
]

[tool.ruff]
# The root's rules, so the fork's CI (`ruff check .` at the root) and a run from
# here agree; only the first-party package differs.
extend = "../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["qalun_web"]
